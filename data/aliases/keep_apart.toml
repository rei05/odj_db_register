# ===========================================================================
# --- アーティスト名（artist フィールド） ---
# ===========================================================================
#
# ここから下は artist 欄向け。このファイルは field を区別しないので、上の
# work のペアと同じ [[pair]] に並べる（block.load_keep_apart() は field を
# 見ずに全部読む。artist の値と work の値でキーが衝突しないことは確認済みで、
# 唯一ぶつかる「supercell」については下の ryo / supercell の項に書いた）。
#
# artist 欄は「アーティスト名の欄」ではなく**何でも入る欄**で、個人・グループ・
# キャラクター名義・声優名・合同名義・リミキサー名が混在する。work とは危険の
# 種類が違うので、artist で特に効くものを3つ挙げておく。
#
# ① 合同名義の分解。`feat.` `×` `x` `&` `with` `from` で名前が並ぶ表記を
#    「本体アーティスト」に寄せてしまう。MusicBrainz が実際にそれをやるので
#    （実測: `May'n・中島愛`→`中島愛`、`supercell/やなぎなぎ`→`やなぎなぎ`、
#    `ふうり from STAR☆ANIS`→`STAR☆ANIS`、23組中12組がこの型）、LLM は
#    「API の正式名称」という強い根拠つきで統合を提案してくる。
# ② キャラ名義と声優本人名義の混同。`長門有希(茅原実里)` に対して
#    MusicBrainz が `茅原実里` を返す。逆に**同じキャラクター名**なら注記の
#    有無は表記ゆれなので統合してよい（`大槻唯` / `大槻唯(CV:山下七海)`）。
#    分けるべきなのは「別のキャラ」「キャラと生身」の組だけ。
# ③ 綴りが1〜2文字違う別人。`LiSA`/`ELISA`、`HALCALI`/`halca`、
#    `ICHICO`/`Machico`、`じん`/`ジン`。work の「1期と2期」に当たる位置に
#    artist ではこれが来る。agg キーはカタカナをひらがなに畳むので
#    `じん` と `ジン` は agg 辺（一番強い辺）で直結する。
#
# 各ペアの reason には work 側と同じく「何行あるか」「共起する曲名・元ネタが
# 重複するか」「どのクラスタでどの種別の辺で繋がっているか」を書く。artist では
# 「同じ DJ が両方の表記を使っているか」「MusicBrainz が別 MBID を返すか」
# （out/aliases/evidence.artist.json）も根拠に使える。
#
# 迷ったものは入れていない。特に、**一般知識では別人だが plays.json 上では
# 同じ曲・同じ元ネタに落ちている**組がいくつもあり（`ChouCho`/`ChouChou`、
# `戦場ヶ原ひたぎ(斎藤千和)`/`斎藤千和` など）、そちらは実データを優先して
# 見送った。理由は該当ペアの reason に書き残してある。
