# 絶対に統合しないペア。
#
# この後 LLM に「この2つの work 表記は同じ作品か」を判定させるが、LLM は
# シリーズものをまとめたがる（同じ「アイドルマスター」「ラブライブ!」ブランドなら
# 同じ作品だろう、と考えてしまう）。統合は不可逆で情報が失われるので、
# 実データで裏取りできた「確実に別物」のペアだけをここで先に固定する。
#
# 迷ったものは入れていない（後段で人間が GUI で1件ずつ判断する）。
# 判断の根拠は src/odj/aliases/block.py が生成した out/aliases/clusters.work.json
# （候補クラスタと辺の種別 substr/agg/bigram/edit/caseonly）と、
# web/public/data/plays.json の実データ突き合わせの両方から取った。
#
# 各ペアの reason には「何行あるか」「共起アーティスト・登場キャラが重複するか」
# を書く。「一般的に別作品だから」ではなく実データの分かれ方を根拠にしている。

# --- けいおん! シリーズ -----------------------------------------------------

[[pair]]
a = "けいおん!"
b = "けいおん!!"
reason = """1期(2009)と2期(2010)。plays.json 上で「けいおん!」13行・「けいおん!!」9行の
曲名は完全に排他的（ふわふわ時間/U&I/Cagayake!GIRLS/翼をください/Don't say lazy/レッツゴー
が「けいおん!」側、ごはんはおかず/天使にふれたよ!/Utauyo!!MIRACLE/いちごパフェが止まらない/
GO!GO!MANIAC/Listen!! が「けいおん!!」側で、両者に重複する曲名は無い）。
out/aliases/clusters.work.json の work-0006 では両者が substr/agg 辺だけで
同一クラスタに落ちており、`!` の数を無視すると自動では区別できない。
なお素の「けいおん」(4行)は Don't Say Lazy(1期の曲)と ごはんはおかず(2期の曲)が
両方入っており、この行自体は1期/2期のどちらとも決め打てないため、このペアには含めない。"""

