# 曲名欄から原曲名を取り出せない行の手当て。
#
# 検索で当てたいのは原曲名であって、どのリミックスかは関心事ではない。
# リミックス表記の除去は web/src/lib/normalize.ts の baseKey() が規則でやるので、
# ここに書くのは**規則では原曲名にならないもの**だけ。
#
# 実データの 2410 行に baseKey() を当てて残ったのは、ほぼ全部が
# 「アーティスト名 - 曲名」の形で動画サイトの表記をそのまま貼ったもの。
# どちらが曲名かは文字列からは決まらない（「ray - Leo/need」は左が曲名、
# 「米津玄師 Kenshi Yonezu - KICKBACK」は右が曲名）ので、人間が読んで書く。
#
# raw    … plays.json の曲名そのまま。完全一致で引く
# title  … 原曲名。これが baseKey の入力になる
# artist … 曲名欄に紛れていたアーティスト名。分かる場合だけ書く（推測しない）
# where  … どの回の誰のセトリか
# reason … なぜそう読んだか

# ---------------------------------------------------------------------------
# アーティスト名 - 曲名
# ---------------------------------------------------------------------------

