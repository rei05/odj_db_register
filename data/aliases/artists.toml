# アーティスト名の同値クラス。表記ゆれを1つの正準表記に寄せた結果。
#
# odj.aliases decide が末尾に追記する（人間が GUI で1件ずつ判断した結果）。
# 追記しかしないので、手で直した整形やコメントは残る。
#
# canonical  … 検索と表示に使う正準表記。variants か提案の中にある文字列しか
#              置かない（実データのどこにも無い名前を創作しないため）
# variants   … この正準表記に寄せる生表記。plays.json にそのまま現れる文字列
# approved   … 人間が確認したか。**true を書くのは人間の判断だけ**
# confidence … high / medium / low。export に出るのは high と medium だけ
# reason     … なぜ同じと判断したか。実データの根拠を書く

[[artist]]
id = "artist-6ed8c801"
canonical = "Bump of Chicken"
variants = [
    "BUMP OF CHICKEN",
    "BUMP OF CHIKEN",
    "Bump of Chicken",
    "Bump of Chikin",
    "bump of chikin",
]
approved = true
confidence = "high"
source = "human"
where = "第4回〜第15回 ha ほか"
decided_at = "2026-08-01T20:00:52+09:00"
reason = "候補の表記はすべて大小・空白・記号の違い、または1〜2文字のタイプミス（CHICKEN→CHIKEN、Chikin）であり、edgeKinds に caseonly と edit が含まれています。rows はそれぞれ 1 行ずつで、同じ DJ（ha, tri）や同一曲名が出てくることから同一アーティストと判断できます。"

[[artist]]
id = "artist-e6643fb7"
canonical = "DECO*27"
variants = ["DECO*27", "Deco*27"]
approved = true
confidence = "high"
source = "human"
where = "第3回〜第15回 ha ほか"
decided_at = "2026-08-01T20:00:55+09:00"
reason = "DECO*27 と Deco*27 は rows が 12 と 1、同じ DJ tri が使用している点、coTitles が一部重複し、edges で \"agg,bigram,caseonly\" と示されているほか、MusicBrainz の api_results で title が \"DECO*27\" と一致しているため、大小・記号の違いだけの表記揺れと判断できる。"
