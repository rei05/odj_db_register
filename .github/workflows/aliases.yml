name: Generate alias candidates with Groq API

on:
  workflow_dispatch:
    inputs:
      field:
        description: 'work / artist'
        default: 'work'
      model:
        # Groq API のモデル ID。無料枠は RPD 1,000 / TPM 8,000 / TPD 200,000（openai/gpt-oss-120b、
        # ドキュメント記載時点）で、縛りになるのは TPM。
        # スキーマ強制（strict な json_schema）が効くのは gpt-oss 系（120b/20b）だけなので、
        # ここを他のモデルに差し替えるとスキーマ強制が外れて提案が静かに質を落とすことがある。
        description: 'Groq API のモデル ID（既定は openai/gpt-oss-120b。gpt-oss 系以外はスキーマ強制が効かない）'
        default: 'openai/gpt-oss-120b'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # fetch を先に回す。block が evidence のリダイレクトを辺として使うため
      # （「ナナシス」と「Tokyo 7th シスターズ」は文字列類似では繋がらない）。
      # fetch 自体はクラスタを見ないので、この順で問題ない。
      - name: Fetch evidence from external APIs
        run: PYTHONPATH=src python -m odj.aliases fetch --field ${{ inputs.field }}

      - name: Block duplicate clusters
        run: PYTHONPATH=src python -m odj.aliases block --field ${{ inputs.field }}

      - name: Ask Groq API to generate candidates
        run: PYTHONPATH=src python -m odj.aliases ask --field ${{ inputs.field }} --model ${{ inputs.model }}
        env:
          # secrets.GITHUB_TOKEN と違い Actions が自動で用意してくれるトークンではないので、
          # リポジトリの Settings > Secrets に GROQ_API_KEY を事前に手動登録しておく必要がある。
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # 規則で安全と言い切れるぶんは、候補を作った**この時点で**承認まで済ませる。
      # 人間に判断を求める対象を、PR が届く前に絞りきるのが狙い（work では 150
      # クラスタ中 71 個がここで消え、レビュー GUI には最初から出てこない）。
      # ask の後でなければならない。auto は _proposed/ の提案を規則に当てる処理で、
      # 提案が無いクラスタは「提案が無い」として人間に回すため。
      # ネットワークには出ないので、ここが失敗しても外部要因ではない。
      - name: Auto-approve the candidates that rules can settle
        run: PYTHONPATH=src python -m odj.aliases auto --field ${{ inputs.field }}

      - name: Create pull request with candidates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: aliases/${{ inputs.field }}-proposal
          # _proposed/ だけでなく auto が書いたぶんも運ぶ。**これが無いと自動承認が
          # 手元に届かず、レビュー GUI に 71 件が出たままになる。**
          # decisions.jsonl は追記専用の監査ログで、手元の判断と衝突し得るが、
          # 衝突しても両方を残せば済む（行の順序に意味は無い）。
          #
          # **auto.toml は回している field のぶんだけ書く。** 両方を並べると、
          # work の実行では artists.auto.toml が存在せず
          # `fatal: pathspec 'data/aliases/artists.auto.toml' did not match any files`
          # で git add が丸ごと落ち、**1ファイルもステージされないまま commit に
          # 進んで PR が作られない**（実際にそれで失敗した）。auto は承認 0 件でも
          # ファイルを作るので、この1行は常に実在する。
          add-paths: |
            data/aliases/_proposed/
            data/aliases/${{ inputs.field }}s.auto.toml
            data/aliases/decisions.jsonl
          title: Alias candidates for ${{ inputs.field }} field
          body: |
            Groq API が生成した候補と、そのうち**規則で安全と言い切れるぶんの自動承認**です。

            - `data/aliases/_proposed/` … 提案。approved を持たないので公開データ（aliases.json）には出ません
            - `data/aliases/*.auto.toml` … 規則を全部満たしたぶん。**approved=true** なので、`odj.aliases export` を回すと公開データに入ります。規則は `src/odj/aliases/auto.py` の冒頭にあります

            **中身のレビューは不要です。** 自動承認したぶんはレビュー GUI に出てこないので、マージ後にローカルで `npm run review` を実行し、**残った候補だけ**を判断してください。自動承認をやり直したいときは `python3 -m odj.aliases auto --field ${{ inputs.field }} --undo` で全部取り消せます（取り消した値は再び候補に戻ります）。
          delete-branch: false
